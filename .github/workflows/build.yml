name: Build APK

on:
  push:
    branches: [main]
    # Trigger on [quick] marker in commit message
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'

jobs:
  build:
    name: Build arm64 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    # Only run if commit message contains [quick] or manual dispatch
    if: contains(github.event.head_commit.message, '[quick]') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r28c
          build-tools: 36.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build native dependencies (PRoot, Alpine rootfs)
        run: |
          cd deps
          ./build_proot.sh
          ../scripts/prepare_android_sandbox.sh

      - name: Grant Gradle permission
        run: chmod +x src/android/gradlew

      - name: Build Debug APK
        run: |
          cd src/android
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Auto-push version bump (if [quick] and not workflow_dispatch)
        if: contains(github.event.head_commit.message, '[quick]') && github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "Minis Bot"
          git config user.email "minis@local"
          # No version bump needed for debug builds, but we could tag
          echo "Build completed successfully"

  # Optional: Release build on tag
  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: r28c

      - name: Build native dependencies
        run: |
          cd deps
          ./build_proot.sh
          ../scripts/prepare_android_sandbox.sh

      - name: Build Release APK
        run: |
          cd src/android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: src/android/app/build/outputs/apk/release/app-release.apk