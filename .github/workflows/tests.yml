name: Unit Tests

# [T-test-only-ci] Test verification WITHOUT building any APK.
#
# Runs the same JVM unit-test gate as build.yml (same task, same scoped
# --tests filter, same proven-green setup steps) but stops there: no
# assembleClone, no artifact upload. This exists so the agent workflow can be
# "verify the code works BEFORE the user authorizes an APK build":
#
#   - push with `[test]` in the commit message, or
#   - manual workflow_dispatch
#
# build.yml is untouched: it still only fires on `[quick]`, which stays
# reserved for pushes the user has authorized to produce an installable APK.

on:
  workflow_dispatch:
  push:
    branches: [main, feat/message-rewrite-visual]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'

jobs:
  tests:
    name: JVM unit tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: "Setup Android SDK (manual, action v3 has dead tools package)"
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1
          "$SDKMANAGER" --list_installed | head -20

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build native dependencies (PRoot, Alpine rootfs)
        run: |
          cd deps
          ./build_proot.sh
          ../scripts/prepare_android_sandbox.sh

      - name: Grant Gradle permission
        run: chmod +x src/android/gradlew

      # Same scoped filter as build.yml's gate — see the notes there for why
      # the filter is not the whole suite (OpenAIProviderTest /
      # TerminalSanitizerTest were red before the gate existed).
      - name: Run unit tests
        run: |
          cd src/android
          ./gradlew :app:testCloneUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      # [T-diag-annotations] TEMPORARY: the sandbox lost access to the logs
      # API, so surface the ACTUAL compile/test failure lines as workflow
      # annotations (readable via the annotations API without the zip).
      # Remove once the CI saga is green.
      - name: "Diag: surface failure lines as annotations"
        if: failure()
        run: |
          cd src/android
          OUT=$(./gradlew :app:compileCloneUnitTestKotlin --no-daemon 2>&1 | grep -E "^e: |error: " | head -15 || true)
          {
            echo "## CI failure diagnosis (auto)"
            if [ -n "$OUT" ]; then
              echo "### COMPILE ERRORS"
              echo '```'
              echo "$OUT"
              echo '```'
            else
              echo "### COMPILE CLEAN — test failures:"
              for f in app/build/test-results/testCloneUnitTest/*.xml; do
                FAILS=$(grep -o 'failures="[0-9]*"' "$f" 2>/dev/null | head -1 | grep -o '[0-9]*' || echo 0)
                if [ "$FAILS" -gt 0 ]; then
                  echo "- **$(basename "$f" .xml)** — $(grep -o 'message="[^"]*"' "$f" | head -1 | cut -c1-400)"
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-no-apk
          path: src/android/app/build/reports/tests/
          retention-days: 7
