[package]
name = "minisd"
version = "0.1.0"
edition = "2021"
description = "OpenMinis native daemon (M-R1 skeleton): vault mode serves the contract-v1 JSON-RPC echo on 127.0.0.1:7824"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Spec §3 (docs/RUST_MIGRATION_SPEC.md): size discipline for the APK
# budget — the python vault this eventually replaces costs tens of MB in
# the rootfs, the daemon must stay single-digit MB. Micro-arch targets
# (target-cpu=cortex-x4) are FORBIDDEN by the spec verdict — the cluster
# is X4 + A720 + A520 and every core must run the binary.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
