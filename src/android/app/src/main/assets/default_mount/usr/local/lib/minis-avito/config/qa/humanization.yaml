# humanization.yaml — как превратить ИИ-текст в человеческий
#
# Принцип: убрать паттерны, по которым ИИ-текст опознаётся, сохранив смысл.
# Не маскировка под человека с целью обмана — это просто удобство для продавца,
# который не хочет разговаривать с ботом.

# Словарь замен: ИИ-маркеры → живые обороты
replacements:
  # Избыточная вежливость
  "Здравствуйте,": "Здравствуйте,"
  "Добрый день,": "Добрый день,"
  "Здравствуйте!": "Привет,"
  "Буду признателен": "Спасибо"
  "Буду благодарен": "Спасибо"
  "Был бы благодарен": "Спасибо"
  "Если вас не затруднит": ""
  "Подскажите, пожалуйста": "Подскажите"
  "Не могли бы вы": "Можете"
  "Хотел бы уточнить": "Уточню"
  "Хотелось бы узнать": "А скажите"
  "Было бы здорово": "Хорошо бы"

  # Канцеляризмы — заменяем ТОЛЬКО когда они в вопросе, не в ответе
  "осуществлялась ли": "была"
  "использовалась ли карта": "была карта"
  "использовалась ли": "была"
  "предоставляется ли": "есть"
  "присутствует ли": "есть"
  "предполагается ли": "хочешь"
  "в связи с": "по"
  "в рамках": "для"
  "в настоящее время": "сейчас"
  "на постоянной основе": "постоянно"
  "необходимость в постоянной нагрузке была": "постоянная нагрузка была"
  "Необходимость в": "Нужно"

  # Структурные шаблоны ИИ (списки, двоеточия, нумерация)
  "Следующие вопросы:": "Спрошу параллельно:"
  "Несколько вопросов:": "Спрошу сразу:"
  "Спасибо заранее.": ""
  "Буду ждать вашего ответа.": "жду"
  "Хорошего дня!": ""
  "Всего доброго!": ""

# Аббревиатуры, которые живые люди используют в чате
live_abbreviations:
  - ["компьютер", "комп"]
  - ["видеокарта", "видяха"]
  - ["видеокарта", "видюха"]
  - ["видеокарту", "видяху"]
  - ["видеокарты", "видяхи"]
  - ["комплектующие", "компы"]
  - ["температура", "темп"]
  - ["потребление", "потреб"]
  - ["проверка", "провер"]
  - ["пожалуйста", "пж"]
  - ["сейчас", "щас"]
  - ["вообще", "ваще"]
  - ["очень", "оч"]
  - ["наверное", "наверн"]
  - ["что-то", "что-л"]
  - ["какой-нибудь", "какой-н"]
  - ["приблизительно", "приблиз"]

# Концевики, характерные для живого общения в чатах
endings:
  - "?"
  - "?"
  - "?"
  - "ок?"
  - "подскажи"
  - "?"

# Типичные "торопливые" опечатки, по одной на сообщение (не генерируй больше)
# Эти ошибки ЕСТЕСТВЕННЫЕ — короткие пропуски или нажатия не той клавиши.
# Не используем замены букв из других раскладок (treasure вместо клад — это
# уже слишком).
natural_typos:
  - source: "Можете сказать"
    target: "Можешь сказать"
    prob: 0.4
  - source: "Подскажите"
    target: "Подскажи"
    prob: 0.5
  - source: "Приветствую"
    target: "Привет"
    prob: 0.6
  - source: "Спасибо заранее"
    target: "Спасибо за ранее"
    prob: 0.05
  - source: "Подскажите, пожалуйста"
    target: "Подскажи пож-та"
    prob: 0.05
  - source: "Сможете"
    target: "Сможеш"
    prob: 0.03
  - source: "купил"
    target: "купил,"
    prob: 0.05

# Чего КАТЕГОРИЧЕСКИ НЕ делаем (это уже выглядит как ИИ):
banned:
  - "Маркированные списки 1. 2. 3."
  - "Заголовки внутри сообщения ## Вопросы"
  - "Идеальная пунктуация точки везде"
  - "Одинаковая длина предложений"
  - "Перечисление через точку с запятой"
  - "Длинное тире вместо дефиса"
  - "Конструкции В первую очередь"
  - "Конструкции Также хотел бы"
  - "Конструкции Помимо этого"
  - "Слово конкретно"
  - "Слово определенно"
  - "Слово исключительно"
  - "Слово непосредственно"
  - "Данное устройство вместо карта"
  - "Осуществлять вместо делать"
  - Избыточные вводные ("Собственно говоря,..", "Стоит отметить, что...")

# Стилистика живой переписки (что ДЕЛАЕМ):
style:
  # Структура: 1-3 предложения в одном сообщении, не больше
  max_sentences: 3
  # Длина: 60-200 символов в среднем
  preferred_length: "60-200 символов"
  # Используем "ты" или "вы" в зависимости от первого сообщения продавца
  honor_form: "match_seller"
  # Смайлики: 0-1 в сообщении, не каждый раз
  emoji_prob: 0.15
  # Если продавец пишет коротко — отвечаем коротко. Если развёрнуто — длиннее
  mirror_length: true
