# qa/dictionary.yaml — вопросы продавцу по категориям
#
# Структура:
#   questions.<категория>.<тип>.<id>:
#     text: шаблон (с {placeholders})
#     when: условие показа (по фото/описанию/модели)
#     priority: вес (выше = важнее)
#     follow_up: что спросить, если ответ неубедительный
#
# Типы вопросов:
#   universal — уместны ВСЕГДА, не зависят от объявления
#   photo_driven — задаём только если видим проблему на фото
#   risk_driven — задаём при обнаруженных red flags (mining, repair, no box)
#   model_specific — зависят от конкретной модели (Phoenix vs KFA2 SG)

universal:
  usage_history:
    priority: 100
    text: "Карта использовалась только для игр или был майнинг/длительные нагрузки 24/7? Примерно сколько времени и в каких условиях работала?"
    why: "главный фильтр: майнинг убивает карту за 1-2 года, после него VRAM деградирует"

  working_hours:
    priority: 90
    text: "Сколько примерно часов/лет карта реально использовалась? Если знаете total hours из HWiNFO/GPU-Z — вообще огонь."
    why: "средняя игровая карта: 4-8 часов в день, майнинг: 24/7 → 4-8x разница"

  temperature_max:
    priority: 85
    text: "Какой был максимальный нагрев в играх, бенчах за время использования? Если стоял MSI Afterburner — пиковые значения из его логов идеально."
    why: ">85°C длительно = ускоренная деградация термопасты и VRAM"

  benchmark_video:
    priority: 80
    text: "Сможешь снять короткое видео (минуту-две), где видно сам FurMark или Heaven, и чтобы в Afterburner были температуры GPU + hotspot, частота и потребление? И желательно, чтобы хотя бы кулер карты в кадр попал."
    why: "видео нельзя подделать, в отличие от скриншота"

  packaging:
    priority: 70
    text: "Имеется ли оригинальная коробка и чек? Когда и где брали новой?"
    why: "коробка+чек = проще вернуть в гарантию, чек = доказательство не-майнинга"

  in_person_check:
    priority: 75
    text: "Где и когда можно посмотреть вживую? Могу подъехать со своим софтом (GPU-Z, FurMark, OCCT)."
    why: "встреча = страховка от скрытых дефектов; софт = объективная проверка"

  transfer:
    priority: 60
    text: "Перевод до осмотра не делаю, по месту нал или перевод после тестов. Ок?"
    why: "продавцы, требующие предоплату — частый признак scam"

  reason_for_sale:
    priority: 50
    text: "Почему продаёшь?"
    why: "апгрейд, дубликат, ненадобность — норм; «срочно нужны деньги» — часто риск"


photo_driven:
  visible_wear:
    priority: 95
    when: "на фото видна пыль, следы вскрытия или жёлтые пятна на термопасте"
    text: "На фото вижу пыль / следы вскрытия. Термопасту меняли? Когда последний раз чистил?"
    why: "если меняли сами — могли повредить винты, термопрокладки VRAM"

  cooler_damage:
    priority: 90
    when: "видны сломанные лопасти вентилятора или погнутые рёбра"
    text: "У одного вентилятора лопасть/ребро повреждено. Это было до покупки или уже у тебя?"
    why: "механическое повреждение снижает ресурс на годы"

  bent_pins:
    priority: 85
    when: "видны загнутые контакты PCIe или нестандартная конструкция"
    text: "Контакты PCIe ровные? На фото вроде есть небольшое отклонение."

  thermal_pads:
    priority: 70
    when: "карта серии Phoenix / Gaming Pro / Dual — обычно меняют термопрокладки"
    text: "Термопрокладки на памяти родные или менял? Если менял — на что?"

  dual_bios:
    priority: 65
    when: "MSI Gaming X / Trio, Asus Strix, Gigabyte Aorus — есть dual BIOS"
    text: "У карты dual BIOS — оба работают? Какой сейчас активен?"


risk_driven:
  mining_suspect:
    priority: 100
    when: "в тексте 'майнинг', 'ферма', 'rig', '24/7', 'whattomine'"
    text: "Вижу что использовалась в майнинге. Сколько примерно часов наработки? Вентиляторы меняли?"

  no_photos_real:
    priority: 100
    when: "фото из интернета или стоковые картинки"
    text: "Можешь скинуть фото с другого ракурса, желательно с серийником?"

  too_cheap:
    priority: 90
    when: "цена ниже медианы более чем на 20%"
    text: "Почему такая цена? Дефект есть какой-то?"

  refurbished_mention:
    priority: 95
    when: "в тексте 'восстановленная', 'реф', 'реболл', 'после ремонта'"
    text: "Что конкретно ремонтировали? Кто делал? Есть документы?"

  warranty_void:
    priority: 85
    when: "серийник не читается или заклеен"
    text: "Почему серийник заклеен? Это стоковое состояние?"

  delivery_only_no_face:
    priority: 80
    when: "только доставка, без личной встречи"
    text: "Можно при встрече проверить перед отправкой? Или по видеосвязи с камерой на стол?"


model_specific:
  kfa2_sg:
    when: "model_contains: kfa2"
    text: "У KFA2 SG охлаждение простое. Какие температуры под нагрузкой? Термопрокладки менял?"

  msi_gaming_x_trio:
    when: "model_contains: gaming x trio"
    text: "У Gaming X Trio бывает шум вентиляторов на низких оборотах. У тебя этого нет?"

  palit_gamerock:
    when: "model_contains: gamerock"
    text: "Palit GameRock бывает с треском дросселей. У тебя тихо под нагрузкой?"

  gigabyte_eagle:
    when: "model_contains: eagle"
    text: "У Gigabyte Eagle охлаждение простое. Температуры какие? Термопасту родную оставил?"

  asus_tuf:
    when: "model_contains: tuf"
    text: "У TUF в первых ревизиях была проблема с термопрокладками. У тебя какой ревизии?"

  gigabyte_aorus:
    when: "model_contains: aorus"
    text: "Aorus Master большой, проверь что влезет в корпус. У тебя какой ревизии (rev 1.0/2.0)?"
