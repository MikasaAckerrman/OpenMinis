# Фильтр: только в заданном регионе
# Замер 2026-09-07: Авито подмешивает лоты из других городов всегда,
# даже с localPriority=1. Поэтому фильтр по тексту адреса обязателен.
name: in-this-region
description: Отсеять лоты не из целевого региона

rules:
  # Москва — распознаётся по метро ("6–10 мин.") или явному "Москва"/"Московская обл."
  moskva:
    keep_if_text_matches:
      - "(?i)москва"
      - "(?i)московская"
      - "\\d+[–\\-]\\d+\\s*мин\\."        # метро всегда московское
      - "\\bмин\\.\\s*$"                  # "до 5 мин." в конце строки
      - "(?i)подмосков"

  # Ульяновск — распознаётся по явному упоминанию
  ulyanovsk:
    keep_if_text_matches:
      - "(?i)ульяновск"
      - "(?i)ульяновская"
      - "(?i)димитровград"      # второй город региона

  # Для других городов — паттерн должен совпадать с именем региона
  default_template: "{name_lower}"
