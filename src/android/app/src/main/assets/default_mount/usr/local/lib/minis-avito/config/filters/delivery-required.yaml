# Фильтр: только лоты с доставкой Авито
# Замер 2026-09-07: когда доставка включена, гео не важно — Авито возит
# между городами. Этот фильтр оставляет только то, что можно получить
# без личной встречи, и помечает дальние.
name: delivery-required
description: Оставить только лоты с доставкой Авито

rules:
  require_delivery:
    keep_if_text_matches:
      - "(?i)доставка от"
      - "(?i)авито доставка"

  # Если в заголовке явно "Только доставка" — это плюс
  full_delivery_bonus:
    pattern: "(?i)только доставка"
    score_bonus: -5    # отрицательный = понижение risk

  # Признак удалённости: "Доставка от 3 дней" → далеко, дороже
  far_delivery:
    pattern: "(?i)доставка от\\s*[3-9]\\s*д"
    risk_score: 10
    note: "далеко от покупателя, итог выше из-за доставки"

  # Короткая доставка — близко
  near_delivery:
    pattern: "(?i)доставка от\\s*[1-2]\\s*д"
    score_bonus: -3
