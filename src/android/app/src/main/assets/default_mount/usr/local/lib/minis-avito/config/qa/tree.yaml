# Дерево вопросов продавцу: always / conditional / answers.
# Не удалять: используется humanize.py --mode select и report.py.

always:
  - id: mining
    q: "Карта только для игр была или под нагрузкой долго гонялась?"
  - id: age
    q: "Сколько лет карте и сколько в день примерно работала?"
  - id: gpuz
    q: "Скинь скрин GPU-Z, вкладка Graphics Card?"
    must_have: true
  - id: reason
    q: "Чего продаёшь, апгрейд?"

conditional:
  - flag: too_cheap
    q: "Цена ниже рынка заметно - с чем связано?"
  - flag: no_box
    q: "Коробка и чек остались?"
  - flag: no_delivery
    q: "Доставку Авито сделаешь? Проверю по факту получения."
  - flag: high_price
    q: "Почему дороже аналогов?"
  - flag: low_rating
    q: "Отзывы не по картам - давно торгуешь?"

answers:
  "для игр|только игры|не майнил":
    next:
      - "А сколько часов в день в среднем?"
      - "В играх не грелась? Температуры какие были?"
  "майнил|ферма|добыча":
    verdict: "выход из сделки или дисконт 30+ проц"
    next:
      - "Сколько месяцев гоняла и в каких температурах?"
  "коробки нет|чек не сохранил":
    next:
      - "Понял. Серийник скинуть сможешь с GPU-Z?"
