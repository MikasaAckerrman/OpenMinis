# Фильтр: только десктопные GPU (без ноутбуков, Ti, M)
# Применяется после парсинга выдачи, не через URL.
name: desktop-only
description: Оставить только десктопные карты, отбросить Ti/M/ноутбук/сервис

rules:
  # Жёсткие исключения — заголовок матчит → лот отбрасывается
  hard_exclude_title:
    - "(?i)\\b(3070|3060|4060|4070|5060|5070)\\s*ti\\b"   # ti вариант
    - "(?i)\\b(3070|4060|5060)\\s*m\\b"                  # мобильная M
    - "(?i)laptop"                                        # явно ноутбук
    - "(?i)ноутбук"
    - "(?i)майнинг"                                       # часто скрытый дефект
    - "(?i)на запчасти"
    - "(?i)реболл"
    - "(?i)без видеовыход"
    - "(?i)не работает"
    - "(?i)для ремонта"

  # Мягкие исключения — оставляем, но помечаем risk=high
  soft_warn_title:
    - "(?i)майнинг"
    - "(?i)reball"
    - "(?i)для восстановления"

  # Цена-маркеры: если цена указана как диапазон — мусор
  price_is_range:
    pattern: "(\\d[\\d\\s]*)\\s*[\\-—–]\\s*(\\d[\\d\\s]*)\\s*₽"
    action: exclude

  # Цена указана со скидкой — это нормально, оставляем но фиксируем
  price_with_discount:
    pattern: "(\\d[\\d\\s]*)\\s*₽\\s*(\\d[\\d\\s]*)\\s*₽\\s*[−\\-]\\s*(\\d+)\\s*%"
    action: keep
    fields:
      - old_price
      - new_price
      - discount_pct
